<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro / EduControll</title>
    <link rel="stylesheet" href="/Templates/css/second.css">
</head>
<body>
    <!-- CABEÇALHO -->
    <header class="topbar">
    <div class="logo">
        <form action="/Templates/html/index.html" method="GET">
        <h2>EduControll</h2>
        </div>
        <div class="usuario">
            <p>Admin</p>
            <input type="submit" value="Sair">
              </form>
        </div>
    </header>
    <!-- CONTEÚDO -->
    <main class="pagina">
        <section class="cadastro">
            <!-- LADO ESQUERDO -->
         <div class="apresentacao">
         <h1>
            Cadastro de novo usuário
         </h1>
            <div class="linha"></div>
        <span class="description">
            Gestão escolar simples,
            organizada e eficiente.
         </span>
            </div>
            <!-- LADO DIREITO -->
            <div class="formulario">
                <div class="titulo">
                    <h2>Cadastar Usuário</h2>
                    <p>
                        Preencha os dados abaixo para
                        realizar o cadastro.
                    </p>
                </div>
                <form method="GET">
                    <!-- NOME -->
                    <div class="campo">
                        <label for="nome">
                            Nome completo
                        </label>
                        <input
                            type="text"
                            id="nome"
                            name="nome"
                            placeholder="Digite o nome completo"
                            required
                        >
                    </div>
                    <!-- EMAIL -->
                    <div class="campo">
                        <label for="email">
                            E-mail
                        </label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="usuario@escola.com"
                            required
                        >
                    </div>
                    <!-- PERFIL -->
                    <div class="campo">
                        <label for="perfil">
                            Perfil de acesso
                        </label>
                        <select
                            id="perfil"
                            name="perfil"
                            required
                        >
                            <option value="">
                                Selecione um perfil
                            </option>
                            <option value="aluno">
                                Aluno
                            </option>
                            <option value="professor">
                                Professor
                            </option>
                            <option value="administrador">
                                Administrador
                            </option>
                        </select>
                    </div>
                    <!-- SENHA -->
                    <div class="campo">
                        <label for="senha">
                            Senha provisória
                        </label>
                        <input
                            type="password"
                            id="senha"
                            name="senha"
                            placeholder="Digite uma senha"
                            required
                        >
                        <small>
                             A senha poderá ser alterada posteriormente.
                        </small>
                    </div>
                    <!-- BOTÕES -->
                    <div class="acoes">
                        <a href="#" class="cancelar">
                            Cancelar
                        </a>
                        <button type="submit">
                            ✓ Criar usuário
                        </button>

                    </div>

                </form>

            </div>

        </section>

    </main>

</body>
</html>
