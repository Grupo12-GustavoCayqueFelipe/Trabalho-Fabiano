{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduControll — Escolha seu portal</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <main class="login-box">
        <div class="logo"><h2>EduControll</h2></div>
        <p>Selecione o portal de acesso correspondente ao seu perfil.</p>
        {% for message in messages %}<p class="mensagem {{ message.tags }}">{{ message }}</p>{% endfor %}
        <p><a href="{% url 'login_academico' %}">Entrar como aluno ou responsável</a></p>
        <p><a href="{% url 'login_funcionarios' %}">Entrar como professor ou administrador</a></p>
        <p class="prototipo">Projeto Integrador — ambiente acadêmico</p>
    </main>
</body>
</html>
